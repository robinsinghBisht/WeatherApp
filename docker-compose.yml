services:
  # Java Spring Boot Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: weather-backend
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      - JAVA_OPTS=-Xmx512m
      - SERVER_PORT=9090
      - OPENWEATHERMAP_API_KEY=${OPENWEATHERMAP_API_KEY}
    networks:
      - weather-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/api/weather/current?city=London&unit=metric"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Next.js Frontend
  frontend:
    build:
      context: ./weather-app-nextjs
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:9090
    container_name: weather-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    networks:
      - weather-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  weather-network:
    driver: bridge

volumes:
  backend-data:
